# 4.5.2: the Gate merges what is ready (docs/DAILY.md, "Risk classes").
#
# Re-checks a pull request whenever something it waits for changes: CI or the
# preview finished, a comment arrived (the reviewer's verdict), a label was
# added (the owner's OK or yes), it left draft. scripts/gate.mjs decides:
# ready, not draft, CI in full on the head commit, the preview smoke test, an
# independent review of the head commit that passes, nothing paused or on
# hold, and the owner's OK for amber or yes for red. Then it squashes the pull
# request and starts the Deploy workflow.
#
# Every trigger here runs main's copy of this file and of the scripts
# (workflow_run, issue_comment and pull_request_target all do), and the pull
# request's code is only read as a diff, never run, so a pull request cannot
# loosen its own gate. The one checkout is of main; nothing here installs or
# runs anything from the pull request (scripts/workflows-test.mjs checks it).
#
# 2026-11-06, the repository is public: a comment wakes the Gate only when the
# repository owner's account wrote it (every session, the reviewer and the
# planner write as it), so a stranger's comments cost no minutes, and
# scripts/gate.mjs reads markers from the owner's comments only. A pull request
# from a fork does not wake it either, and gate.mjs refuses one anyway.
name: Gate
on:
  workflow_run:
    workflows: [CI, Preview]
    types: [completed]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled, ready_for_review]
  workflow_dispatch:
  # 2026-11-10: a run the Gate starts itself (the merge queue's CI by workflow_dispatch)
  # does not wake the Gate when it finishes; seen live on #102. Every 15 minutes the Gate sweeps anyway,
  # so an updated pull request merges within a quarter of an hour. This relies on the repository being
  # public (Actions minutes are free): if it ever goes private, make it hourly ("7 * * * *").
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write
  checks: read
  deployments: read
# 2026-11-08: one Gate run at a time, for every pull request, so two merges can never race (each
# would be checked against a main the other is about to change). A newer run waiting replaces an
# older one waiting; nothing is lost, because every run ends with a sweep of all open pull requests.
concurrency:
  group: gate
  cancel-in-progress: false
jobs:
  # The merge queue: every run is one sweep of all open pull requests, oldest first (scripts/gate.mjs
  # sweep). Whatever woke it, the sweep merges at most one that is ready, then, for the oldest one that
  # waits only for a test with the main of now, starts CI on main's copy of ci.yml by workflow_dispatch
  # (2026-11-11): CI merges main into the head in the runner and pushes nothing, so the head, its review
  # and its preview stand, and a workflow change on main stops no branch. One job, not two.
  gate:
    if: >-
      (github.event_name == 'workflow_run' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' && github.event.comment.user.login == github.repository_owner && (contains(github.event.comment.body, 'mm-review') || contains(github.event.comment.body, 'mm-owner'))) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Up to 4 rounds of a sweep and a wait of at most 30 minutes for the CI it started (--follow):
    # 4 x 30 min stays under this timeout with room for the sweeps.
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: sweep the open pull requests, merge one, test one again with the main of now
        id: sweep
        run: node scripts/gate.mjs sweep --merge --update --follow
      # A merge made with this workflow's token starts no push workflow: scripts/gate.mjs starts the
      # deploy itself right after each merge that is not docs only (mergeOne), so a merge made in an early
      # round of --follow deploys at once, and a job killed by its timeout leaves nothing undeployed.
