# 4.5: the staging Worker the previews run on (docs/SETUP.md, "Previews").
# Every night, and by hand from the Actions tab: the live database copied to
# the staging D1 with accounts, sessions, invites and emails stripped
# (scripts/staging-copy.mjs, which keeps staging's own spend so its $2 a
# month holds), then main deployed to the staging address with its
# migrations. Needs CLOUDFLARE_API_TOKEN. MM_TOKEN (the Judge's, your admin
# token) is copied to the staging Worker so the same five taps let you in;
# STAGING_ANTHROPIC_API_KEY is optional (without it the previews run in mock
# mode: fake merges, free). Staging lets nobody in without the token.
name: Staging
on:
  schedule:
    - cron: "41 7 * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    # 2026-11-11, "credentials: yes": production's secrets live in the GitHub environment "production",
    # which only main may use; a branch or a dispatch on a branch gets none of them.
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STAGING_ANTHROPIC_API_KEY: ${{ secrets.STAGING_ANTHROPIC_API_KEY }}
      # 4.5.2: staging's own admin token once the owner sets STAGING_ADMIN_TOKEN (audit 4.5.1,
      # risk 1: production's token on staging can become a lasting owner passkey); until then, MM_TOKEN.
      MM_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN || secrets.MM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      # The copy only at night or by hand: a merge deploys main on the copy it finds.
      - if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'push'
        run: node scripts/staging-copy.mjs
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply magic-merger-staging --remote --env staging
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --env staging
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.STAGING_ANTHROPIC_API_KEY != ''
        run: printf '%s' "$STAGING_ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY --env staging
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.MM_TOKEN != ''
        run: printf '%s' "$MM_TOKEN" | npx wrangler secret put ADMIN_TOKEN --env staging
