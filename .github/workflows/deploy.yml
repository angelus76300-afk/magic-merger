# 4.5.2: production is deployed only from main, only here (docs/DAILY.md, "Deploys").
#
# On every push to main (a merge), and when the Gate merges (it dispatches this
# workflow, since a merge made with the workflow token starts nothing else):
#   1. CI in full on main's commit (the CI workflow, called).
#   2. Only main's newest commit deploys; an older one waiting here stops.
#   3. The gate's deploy check: nothing paused, and every pull request merged
#      since the last deploy has the owner's OK (amber) or yes (red) its class
#      needs (scripts/gate.mjs deploy). A refusal opens an issue.
#   4. The live database's migrations, then the Worker.
#   5. The smoke test on the live site at 390 by 844, read only
#      (scripts/smoke.mjs live), then the Worker's errors since the deploy
#      (scripts/live-signals.mjs errors).
#   6. If 5 fails: wrangler rollback to the version that was live before, the
#      smoke test again on it, and an issue that says what failed. A migration
#      cannot be rolled back: that is why a migration is amber or red.
# Needs CLOUDFLARE_API_TOKEN and MM_TOKEN (the admin token, for the read only
# routes of the smoke test).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
  deployments: write
  pull-requests: read
  actions: read
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  # Only main's newest commit deploys: an older one that waited behind another
  # deploy stops here, without a deployment record, and the newer one checks
  # every merge since the last deploy.
  tip:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      newest: ${{ steps.tip.outputs.newest }}
    steps:
      - uses: actions/checkout@v4
      - id: tip
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" = "${{ github.sha }}" ]; then echo "newest=true" >> "$GITHUB_OUTPUT"
          else echo "main moved on to $(git rev-parse --short origin/main); that commit deploys instead." | tee -a "$GITHUB_STEP_SUMMARY"; fi
  deploy:
    needs: tip
    if: needs.tip.outputs.newest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://magic-merger.angelus76300.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MM_TOKEN: ${{ secrets.MM_TOKEN }}
      MM_URL: https://magic-merger.angelus76300.workers.dev
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: gate
        id: gate
        run: node scripts/gate.mjs deploy "$SHA" > gate.log 2>&1 || { cat gate.log; exit 1; }; cat gate.log
      - name: build
        run: npm run build
      - name: version live before
        id: before
        run: |
          prev=$(npx wrangler deployments list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const v=l[l.length-1]?.versions?.[0]?.version_id;console.log(v??"")})')
          echo "Live before: $prev" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "version=$prev" >> "$GITHUB_OUTPUT"
      - name: migrations
        run: npx wrangler d1 migrations apply magic-merger --remote
      - name: deploy
        id: deploy
        run: |
          echo "at=$(($(date +%s) * 1000))" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --message "main ${SHA::7} (Deploy workflow run ${{ github.run_id }})"
      - name: install the browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: smoke test
        id: smoke
        run: |
          sleep 10
          node scripts/smoke.mjs live "$MM_URL" --out smoke-live
          # Errors the Worker logged since the deploy, after a minute of cron and players.
          sleep 60
          node scripts/live-signals.mjs errors --since "${{ steps.deploy.outputs.at }}" --max 2
      - name: rollback
        id: rollback
        if: failure() && steps.deploy.outcome == 'success' && steps.before.outputs.version != ''
        run: |
          npx wrangler rollback "${{ steps.before.outputs.version }}" --message "smoke test failed on main ${SHA::7}" --yes
          sleep 10
          node scripts/smoke.mjs live "$MM_URL" --out smoke-after-rollback && echo "ok=true" >> "$GITHUB_OUTPUT" || true
      - name: open an issue
        if: failure()
        env:
          STAGE: ${{ steps.gate.outcome == 'failure' && 'refused by the gate (not deployed)' || steps.deploy.outcome != 'success' && 'migrations or deploy failed' || 'smoke test or errors failed after the deploy' }}
          ROLLED: ${{ steps.rollback.outcome == 'success' && format('rolled back to {0}{1}', steps.before.outputs.version, steps.rollback.outputs.ok == 'true' && ', and the smoke test passes on it' || ', and the smoke test still fails on it') || 'no rollback' }}
        run: |
          gh label create rollback --color B60205 --description "Deploy failed or was rolled back" --force >/dev/null 2>&1 || true
          {
            echo "Deploy of main ${SHA::7}: $STAGE; $ROLLED."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -f gate.log ]; then echo '```'; tail -n 30 gate.log; echo '```'; fi
            if [ -f smoke-live/report.json ]; then echo '```'; node -e 'const r=require("./smoke-live/report.json");for(const c of r.checks.filter(c=>!c.ok))console.log("FAIL",c.name,c.detail)'; echo '```'; fi
            echo
            echo "The planner reads this issue in the morning brief; the next session fixes forward. Close it once fixed."
          } > issue.md
          gh issue create --title "Deploy ${SHA::7}: $STAGE" --label rollback --body-file issue.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-live-${{ github.sha }}
          path: |
            smoke-live
            smoke-after-rollback
          if-no-files-found: ignore
          retention-days: 14
