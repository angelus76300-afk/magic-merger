# Lint (the simulation never imports the view, no import cycles), check
# formatting, typecheck and build everything, then run the simulation checks:
# map generation, reference spells, the loop guard, saving, and every
# challenge both ways (doing nothing must not win, the right magic must win).
# Then the Worker itself under wrangler dev with a stub Claude: invites, the
# budget caps and the bug guard.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    # npm test runs half hour balance scenes (4.4.5 part A) and the wonder
    # checks (part B): about 14 minutes on a runner since part A, and 15
    # cancelled green runs. Room to grow, still a stop for a hung job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run test:worker
