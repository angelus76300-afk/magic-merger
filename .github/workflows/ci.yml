# Lint (the simulation never imports the view, no import cycles), check
# formatting, typecheck and build everything, the risk and gate checks, then
# the Worker itself under wrangler dev with a stub Claude: invites, the budget
# caps and the bug guard.
#
# 4.5.2: `npm test` (the simulation: 19 of these 23 minutes) does not run here.
# The free 2,000 Actions minutes of a private repository were spent at about
# 400 a day, mostly on it. It runs in Claude Code sessions, which cost no
# Actions minutes: the builder before it asks for a review, the reviewer on the
# head commit (its verdict says tests=pass, and the Gate requires it), and the
# planner's night run on main (docs/DAILY.md). On pull requests only; main is
# checked by the Deploy workflow, which calls this one. A draft or a docs only
# change runs the light steps and skips test:worker. A newer push cancels the
# run it replaces.
#
# 2026-11-06, the repository is public: this workflow runs a pull request's own
# code, a fork's included once the owner approves the run, so it names no
# secret and its token only reads (scripts/workflows-test.mjs fails if a job
# here gains a secret without the same-repository guard).
#
# 2026-11-10, the merge queue: the Gate merges main into a ready branch that is
# only behind, and a push made with its token starts no workflow, so it starts
# this one with workflow_dispatch on the branch, naming the pull request and the
# head it expects. The run checks that its commit is that head and reads the
# base and the draft state from the API; a branch that moved fails the run, and
# the Gate prefers a run of the pull request's own event on the same commit.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number (the Gate's merge queue)"
        required: true
      sha:
        description: "The head commit the Gate expects"
        required: true
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Started by the Gate: this commit must be the head it named, of a pull request of this repository.
      # Keyed on the input, never on the event's name: the Deploy workflow calls this one, and in a called
      # workflow github.event_name is the caller's ("workflow_dispatch" when the Gate starts a deploy).
      - name: the pull request the Gate named
        id: pr
        if: inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "not a pull request number: $PR"; exit 1;; esac
          if [ "$GITHUB_SHA" != "$SHA" ]; then echo "the branch moved: this run is on $GITHUB_SHA, the Gate named $SHA"; exit 1; fi
          gh api "repos/$REPO/pulls/$PR" --jq '[.state, .head.sha, .head.repo.full_name, .base.ref, (.draft | tostring), .head.ref] | @tsv' > "$RUNNER_TEMP/pr.tsv"
          IFS=$'\t' read -r state head repo base draft ref < "$RUNNER_TEMP/pr.tsv"
          if [ "$state" != "open" ] || [ "$head" != "$SHA" ] || [ "$repo" != "$REPO" ]; then echo "#$PR is $state at $head from $repo: not this commit of this repository"; exit 1; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Full on main and on a ready pull request that changes more than docs.
      - name: scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          DISPATCHED: ${{ inputs.pr }}
          DRAFT: ${{ github.event.pull_request.draft || steps.pr.outputs.draft }}
          BASE: ${{ github.event.pull_request.base.ref || steps.pr.outputs.base }}
        run: |
          full=true
          if [ "$EVENT" = "pull_request" ] || [ -n "$DISPATCHED" ]; then
            changed=$(git diff --name-only "origin/$BASE...HEAD")
            other=$(printf '%s\n' "$changed" | grep -vE '^(docs/|\.claude/skills/)|\.md$|^\.claude/settings\.json$' || true)
            if [ "$DRAFT" = "true" ] || [ -z "$other" ]; then full=false; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          # In the log too: when GitHub lists the job without its steps, the Gate reads this line.
          echo "Full run: $full" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: risk class
        if: github.event_name == 'pull_request' || inputs.pr != ''
        env:
          BASE: ${{ github.event.pull_request.base.ref || steps.pr.outputs.base }}
          GITHUB_HEAD_REF: ${{ github.head_ref || steps.pr.outputs.ref }}
        run: |
          # main's copy classifies the pull request, so it cannot grade itself.
          if git show "origin/$BASE:scripts/risk.mjs" > "$RUNNER_TEMP/risk.mjs" 2>/dev/null; then cp "$RUNNER_TEMP/risk.mjs" scripts/.risk-main.mjs; else cp scripts/risk.mjs scripts/.risk-main.mjs; fi
          node scripts/.risk-main.mjs --base "origin/$BASE" --head HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f scripts/.risk-main.mjs
      - name: lint
        run: npm run lint
      - name: format
        run: npm run format:check
      - name: build
        run: npm run build
      - name: risk and gate checks
        run: npm run test:risk
      - name: test:worker
        if: steps.scope.outputs.full == 'true'
        run: npm run test:worker
