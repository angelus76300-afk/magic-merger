# The judge's daily look at new programs (3.3): casts each live program the
# judge has not seen in the Spell Lab and sends three frames to the Worker,
# where Haiku scores it (about $0.0004 a program). Needs two repository
# secrets: MM_URL (the game's address) and MM_TOKEN (its ADMIN_TOKEN).
# Without them the job does nothing.
#
# First, the API's growth (3.4.2, scripts/evolve-runner.ts): helpers the
# designer wrote are tested in Node, and engine proposals become issues
# labelled api-gap. No Claude call.
#
# Then the day's new wonders (4.4.5 part C, scripts/wonder-runner.ts): each
# trial wonder is built on three islands of its lands and watched for a day
# and night in Node; it goes live in the pool new islands draw from only if
# it passes. No Claude call.
#
# Then the challenges (3.7, scripts/challenge-runner.ts): spells made or
# rewritten since are tried on each challenge in Node, so a challenge still
# hidden (no verified solution) appears once a player makes a spell that
# solves it, and one whose solver was rewritten is verified again. No
# Claude call.
name: Judge
# 4.5.2: the planner's night run does the same steps every night in its own
# session (no Actions minutes, docs/DAILY.md); this workflow runs by hand only.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Programs to judge at most"
        default: "30"
permissions:
  contents: read
  issues: write
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MM_URL: ${{ secrets.MM_URL }}
      MM_TOKEN: ${{ secrets.MM_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.MM_URL != '' && env.MM_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.MM_URL != '' && env.MM_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.MM_URL != '' && env.MM_TOKEN != ''
        run: |
          npm ci
          npm run evolve
          npm run wonders
          npm run challenges -- 10
          # 4.5.2: in its own folder, so the game's locked dependencies stay as tested.
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node scripts/judge-runner.mjs ${{ inputs.limit || '30' }}
          node scripts/judge-runner.mjs wonders
