# 4.5: a preview of each pull request, to try on a phone before merging
# (docs/SETUP.md, "Previews"). The pull request's build is uploaded to the
# staging Worker as a version with its own address,
# https://pr-<n>-magic-merger-staging.angelus76300.workers.dev, with the
# staging D1 (a nightly copy of the live one, accounts stripped) and $2 a
# month. Production is never touched. Needs one repository secret,
# CLOUDFLARE_API_TOKEN; without it the job does nothing.
#
# 4.5.2: the pull request's own code runs here with the Cloudflare token, so a
# pull request from the Ideas tab's routine (players' words, branch
# claude/feedback-*) gets a preview only once the owner labels it owner-ok
# (audit 4.5.1, risk 1). Then the smoke job plays the newcomer's path on the
# preview at 390 by 844 with main's copy of scripts/smoke.mjs, never the pull
# request's, since it holds the admin token; the Gate waits for it.
#
# 2026-11-06, the repository is public: a pull request from a fork never runs
# here. GitHub already gives a fork's run no secrets; the guard on both jobs
# says so in this file too, so a later change cannot open it by mistake
# (scripts/workflows-test.mjs checks every job that names a secret).
#
# 2026-11-10, the merge queue: the Gate merges main into a ready branch that is
# only behind and starts this workflow itself (workflow_dispatch; a push made
# with its token starts no workflow). Under a dispatch the event carries no pull
# request, and a guard that reads an empty field must refuse, never allow: the
# first step reads the pull request from the API and stops the job, before any
# checkout, unless it is open, of this repository, not a draft, at the head the
# Gate named, and not a feedback branch without owner-ok. The smoke job needs
# that job, so it never runs when the guard refused (workflows-test.mjs).
name: Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number (the Gate's merge queue)"
        required: true
      sha:
        description: "The head commit the Gate expects"
        required: true
permissions:
  contents: read
  deployments: write
concurrency:
  # A label other than owner-ok must not cancel a preview being built.
  # A dispatch gets its own group: it must not cancel a builder's push, nor be cancelled by a label.
  group: preview-${{ github.event.pull_request.number || github.run_id }}${{ github.event.action == 'labeled' && github.event.label.name != 'owner-ok' && format('-{0}', github.event.label.name) || '' }}
  cancel-in-progress: true
jobs:
  preview:
    # 4.5.2: no preview for a draft (Actions minutes); the push that marks it ready builds one.
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'owner-ok') &&
      ((!startsWith(github.head_ref, 'claude/feedback-') && !startsWith(github.event.pull_request.title, 'Feedback:')) || contains(github.event.pull_request.labels.*.name, 'owner-ok')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.upload.outputs.url }}
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # The guard, before any checkout. Under pull_request the job's if already checked the event.
      - name: the pull request the Gate named
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          FROM_EVENT: ${{ github.event.pull_request.number }}
          FROM_EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ]; then
            echo "number=$FROM_EVENT" >> "$GITHUB_OUTPUT"
            echo "sha=$FROM_EVENT_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$PR" in ''|*[!0-9]*) echo "not a pull request number: $PR"; exit 1;; esac
          if [ "$GITHUB_SHA" != "$SHA" ]; then echo "the branch moved: this run is on $GITHUB_SHA, the Gate named $SHA"; exit 1; fi
          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          state=$(jq -r '.state' "$RUNNER_TEMP/pr.json")
          head=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")
          repo=$(jq -r '.head.repo.full_name' "$RUNNER_TEMP/pr.json")
          draft=$(jq -r '.draft' "$RUNNER_TEMP/pr.json")
          feedback=$(jq -r '(.head.ref | startswith("claude/feedback-")) or (.title | startswith("Feedback:"))' "$RUNNER_TEMP/pr.json")
          ownerok=$(jq -r '[.labels[].name] | index("owner-ok") != null' "$RUNNER_TEMP/pr.json")
          if [ "$state" != "open" ]; then echo "#$PR is $state"; exit 1; fi
          if [ "$repo" != "$REPO" ]; then echo "#$PR comes from $repo, not this repository"; exit 1; fi
          if [ "$head" != "$SHA" ]; then echo "#$PR is at $head, the Gate named $SHA"; exit 1; fi
          if [ "$draft" != "false" ]; then echo "#$PR is a draft"; exit 1; fi
          if [ "$feedback" != "false" ] && [ "$ownerok" != "true" ]; then echo "#$PR is a feedback pull request without owner-ok"; exit 1; fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build
      # The pull request's migrations, on staging only (the nightly copy resets it).
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply magic-merger-staging --remote --env staging
      - id: upload
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          N: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          case "$N" in ''|*[!0-9]*) echo "not a pull request number: $N"; exit 1;; esac
          # A dispatch is not cancelled by a builder's push (its own concurrency group): if the branch moved
          # during the build, this older build must not take the pr-<n> address from the newer one.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$(gh api "repos/$REPO/pulls/$N" --jq .head.sha)" != "$SHA" ]; then echo "#$N moved during the build: not uploaded"; exit 1; fi
          npx wrangler versions upload --env staging --preview-alias "pr-$N" --message "PR #$N $SHA" | tee upload.log
          url="https://pr-$N-magic-merger-staging.angelus76300.workers.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url (the admin token, five taps on the title, lets you in)" >> "$GITHUB_STEP_SUMMARY"
  smoke:
    needs: preview
    # Under a dispatch, needs: preview is the guard: a refused preview job skips this one.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Staging's own admin token when it exists (audit 4.5.1, risk 1), production's until then.
      MM_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN || secrets.MM_TOKEN }}
      URL: ${{ needs.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install the browser
        # In its own folder: installing it here without the lock would move the game's own
        # dependencies (wrangler, the Anthropic SDK) to versions CI never tested.
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: the newcomer's path on the preview
        run: |
          # The version takes a few seconds to answer at its alias.
          for i in $(seq 1 12); do curl -sf "$URL/api/health" >/dev/null && break; sleep 5; done
          node scripts/smoke.mjs preview "$URL" --out smoke-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-preview-${{ needs.preview.outputs.number }}-${{ needs.preview.outputs.sha }}
          path: smoke-preview
          retention-days: 14
