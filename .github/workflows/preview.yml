# 4.5: a preview of each pull request, to try on a phone before merging
# (docs/SETUP.md, "Previews"). The pull request's build is uploaded to the
# staging Worker as a version with its own address,
# https://pr-<n>-magic-merger-staging.angelus76300.workers.dev, with the
# staging D1 (a nightly copy of the live one, accounts stripped) and $2 a
# month. Production is never touched. Needs one repository secret,
# CLOUDFLARE_API_TOKEN; without it the job does nothing.
name: Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  deployments: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build
      # The pull request's migrations, on staging only (the nightly copy resets it).
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply magic-merger-staging --remote --env staging
      - id: upload
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler versions upload --env staging --preview-alias "pr-${{ github.event.pull_request.number }}" --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}" | tee upload.log
          url="https://pr-${{ github.event.pull_request.number }}-magic-merger-staging.angelus76300.workers.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url (the admin token, five taps on the title, lets you in)" >> "$GITHUB_STEP_SUMMARY"
