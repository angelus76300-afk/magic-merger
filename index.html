<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15101f" />
    <title>Magic Merger</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="title">Magic Merger</h1>
      <span id="mock-badge" class="badge" hidden title="No API key on the Worker: results are fake and not saved">mock mode</span>
      <span id="admin-badge" class="badge badge-admin" hidden role="button" tabindex="0" title="">admin</span>
      <button id="account-chip" class="account-chip" hidden></button>
      <button id="help" class="help" aria-label="Your account, sync and help">?</button>
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-view="craft-view" aria-selected="true">Craft</button>
        <button class="tab" role="tab" data-view="world-view" aria-selected="false">World</button>
        <button class="tab" role="tab" data-view="challenges-view" aria-selected="false">Challenges</button>
        <button class="tab" role="tab" data-view="feedback-view" aria-selected="false">Ideas</button>
      </nav>
    </header>

    <main id="craft-view" class="view craft">
      <section id="board" class="board" aria-label="Crafting board">
        <p class="board-hint">Drop one item onto another to merge them. Tap an item to read its card.</p>
        <button id="clear" class="board-clear">Clear</button>
      </section>
      <aside id="inventory" class="inventory" aria-label="Discovered items">
        <div class="inventory-head">
          <input id="search" type="search" placeholder="Search" autocomplete="off" />
          <span id="count" class="count"></span>
          <button id="book" class="book-open" title="What you found, how and when">Book</button>
        </div>
        <div id="inventory-filters" class="inventory-filters"></div>
        <div id="inventory-list" class="inventory-list"></div>
      </aside>
    </main>

    <main id="world-view" class="view world" hidden>
      <div id="world-stage" class="world-stage">
        <!-- The vote bar joins this stack above the banner, so neither covers the other (4.1, review M10). -->
        <div class="world-bottom">
          <div id="world-banner" class="world-banner" hidden>
            <strong class="world-banner-title"></strong>
            <span class="world-banner-text"></span>
            <span class="world-banner-hint"></span>
            <span class="world-banner-actions">
              <button class="world-banner-retry">Retry</button>
              <button class="world-banner-leave">Back to my island</button>
            </span>
          </div>
        </div>
        <div class="world-tools">
          <button id="world-challenges">Challenges</button>
          <button id="world-chronicle">Chronicle</button>
          <button id="world-add">+ Villager</button>
          <button id="world-reset">Reset</button>
          <button id="world-sound" aria-pressed="true">Sound on</button>
        </div>
      </div>
      <section class="spellbar" aria-label="Your spells">
        <p id="world-status" class="world-status"></p>
        <div id="spell-tools" class="spell-tools"></div>
        <div id="spell-list" class="spell-list"></div>
      </section>
    </main>

    <main id="challenges-view" class="view challenges-view" hidden></main>

    <main id="feedback-view" class="view feedback" hidden></main>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
