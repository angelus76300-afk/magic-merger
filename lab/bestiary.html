<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bestiary</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #cfe8f7;
        font:
          12px/1.3 ui-sans-serif,
          system-ui,
          sans-serif;
        color: #1d2b36;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #labels div {
        position: absolute;
        transform: translate(-50%, 0);
        white-space: nowrap;
        font-size: 11px;
        color: #233;
        text-shadow: 0 0 3px #fff;
      }
      #labels .section {
        transform: none;
        font-size: 15px;
        font-weight: 600;
      }
      #bar {
        position: absolute;
        left: 8px;
        top: 8px;
        background: rgba(255, 255, 255, 0.85);
        padding: 6px 8px;
        border-radius: 6px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        max-width: calc(100% - 32px);
      }
      #stats {
        font-family: ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <!-- Dev only: every body plan, feature, wild animal and villager look (3.5). Screenshots: scripts/bestiary.mjs. -->
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="labels"></div>
    </div>
    <div id="bar">
      <strong>Bestiary</strong>
      <label><input type="radio" name="pose" value="walk" checked /> walk</label>
      <label><input type="radio" name="pose" value="idle" /> idle</label>
      <label><input type="radio" name="pose" value="fly" /> fly</label>
      <label><input type="radio" name="pose" value="dead" /> dead</label>
      <label><input type="radio" name="pose" value="frozen" /> frozen</label>
      <label><input type="checkbox" id="far" /> far (no details)</label>
      <label><input type="checkbox" id="spin" /> turn</label>
      <span id="stats"></span>
    </div>
    <script type="module" src="./bestiary.ts"></script>
  </body>
</html>
