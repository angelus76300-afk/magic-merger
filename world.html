<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic Merger world</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0816;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;

    <script type="module" src="/src/sim/frame.ts"></script>
  </body>
