<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic Merger world</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0816;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #world {
        cursor: grab;
      }
      #overlay {
        pointer-events: none;
      }
      /* The island tells its stories (2026-11-11): one line saying what the
         camera is on, or what just happened; and the button that starts it. */
      #story {
        position: absolute;
        left: 10px;
        top: 10px;
        max-width: calc(100% - 20px);
        box-sizing: border-box;
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        padding: 8px 14px 8px 12px;
        border: 0;
        border-left: 4px solid #ffc23d;
        border-radius: 4px 12px 12px 4px;
        background: rgba(13, 18, 36, 0.86);
        color: #f6efdc;
        font:
          600 14px/1.3 system-ui,
          sans-serif;
        text-align: left;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        cursor: pointer;
        opacity: 1;
        transition:
          opacity 0.35s,
          transform 0.35s;
      }
      #story[hidden] {
        display: none;
      }
      #story.out {
        opacity: 0;
        transform: translateY(-6px);
      }
      #story .go {
        flex: none;
        color: #ffc23d;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      #pointer {
        position: absolute;
        left: -9px;
        top: -14px;
        width: 0;
        height: 0;
        border: 9px solid transparent;
        border-top: 13px solid #ffc23d;
        border-bottom: 0;
        filter: drop-shadow(0 2px 0 #05080f) drop-shadow(0 0 6px rgba(255, 194, 61, 0.7));
        pointer-events: none;
        animation: pointer-bob 0.9s ease-in-out infinite alternate;
      }
      #pointer[hidden] {
        display: none;
      }
      @keyframes pointer-bob {
        from {
          margin-top: -4px;
        }
        to {
          margin-top: 3px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #pointer {
          animation: none;
        }
      }
      #watch {
        position: absolute;
        left: 10px;
        bottom: 12px;
        min-width: 44px;
        height: 44px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px 0 11px;
        border: 2px solid #05080f;
        border-radius: 10px;
        background: #1b2440;
        color: #f6efdc;
        font:
          700 13px/1 system-ui,
          sans-serif;
        box-shadow: 0 3px 0 #05080f;
        cursor: pointer;
      }
      #watch[hidden] {
        display: none;
      }
      #watch svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }
      #watch[aria-pressed="true"] {
        background: #ffc23d;
        color: #1a1405;
      }
      @media (prefers-reduced-motion: reduce) {
        #story {
          transition: none;
        }
      }
      /* What a tapped creature is doing (3.6). */
      #inspect {
        position: absolute;
        left: 10px;
        top: 10px;
        /* Clear of the page's tools on the right edge of a folded phone. */
        width: min(300px, calc(100% - 78px));
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(21, 29, 51, 0.92);
        color: #f3eedf;
        font:
          13px/1.35 system-ui,
          sans-serif;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      }
      #inspect[hidden] {
        display: none;
      }
      #inspect .head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 6px;
      }
      #inspect .title {
        font-size: 15px;
      }
      #inspect .sub {
        flex: 1;
        color: #a9b2cf;
        font-size: 12px;
      }
      #inspect .follow {
        margin-top: 8px;
        min-height: 44px;
        width: 100%;
        border: 2px solid #05080f;
        border-radius: 10px;
        background: #ffc23d;
        color: #1a1405;
        font:
          700 14px/1 system-ui,
          sans-serif;
        cursor: pointer;
      }
      #inspect .pair {
        display: flex;
        gap: 8px;
      }
      #inspect .pair .follow {
        flex: 1;
      }
      #inspect .follow.become {
        background: #1b2440;
        color: #ffc23d;
        box-shadow: 0 3px 0 #05080f;
      }
      /* Become anything (2026-11-12, possess.ts): the creature's name and its
         thought in the story line, a fixed stick at the bottom left in the
         Watch button's place, its own abilities at the bottom right, and Let go. */
      body.possessed:not(.eyes) #story {
        max-width: calc(100% - 92px);
      }
      body.possessed #story {
        cursor: default;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
      #story .thought {
        color: #a9b2cf;
        font-size: 13px;
        font-weight: 500;
      }
      /* Below the host's row of tools on a desktop (Chronicle, Sound: 44 px from
         10 px), above its rail on a phone (from about 240 px down the frame). */
      #letgo {
        position: absolute;
        right: 10px;
        top: 64px;
        min-width: 44px;
        height: 44px;
        box-sizing: border-box;
        padding: 0 12px;
        border: 2px solid #05080f;
        border-radius: 10px;
        background: #ffc23d;
        color: #1a1405;
        font:
          700 13px/1 system-ui,
          sans-serif;
        box-shadow: 0 3px 0 #05080f;
        cursor: pointer;
      }
      #stick {
        position: absolute;
        left: 12px;
        bottom: 12px;
        width: 112px;
        height: 112px;
        box-sizing: border-box;
        border: 2px solid #05080f;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(27, 36, 64, 0.55) 0 55%, rgba(27, 36, 64, 0.8) 56%);
        box-shadow:
          inset 0 0 0 2px rgba(255, 194, 61, 0.35),
          0 3px 0 #05080f;
        touch-action: none;
        cursor: grab;
      }
      #stick i {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        box-sizing: border-box;
        border: 2px solid #05080f;
        border-radius: 50%;
        background: #ffc23d;
        box-shadow: 0 3px 0 #05080f;
        pointer-events: none;
      }
      /* On a phone, a Fold and a tablet the host's tool rail runs down the right
         edge to the bottom of the frame (44 px and a 10 px margin): the buttons
         keep clear of it at every width (the Sound button covered one at 700 px). */
      #powers {
        position: absolute;
        right: 62px;
        bottom: 16px;
        display: flex;
        gap: 10px;
      }
      #powers button {
        position: relative;
        width: 56px;
        height: 56px;
        padding: 0;
        border: 2px solid #05080f;
        border-radius: 50%;
        background: conic-gradient(#ffc23d var(--ready, 100%), #3a4466 0);
        color: #1a1405;
        font:
          800 11px/1.1 system-ui,
          sans-serif;
        box-shadow: 0 3px 0 #05080f;
        cursor: pointer;
      }
      #powers button span {
        position: absolute;
        inset: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #ffd77a;
      }
      #powers button.cooling span {
        background: #1b2440;
        color: #a9b2cf;
      }
      #letgo[hidden],
      #stick[hidden],
      #powers[hidden] {
        display: none;
      }
      /* Through its eyes (2026-11-12, eyes.ts): the eye button under Let go;
         in the eye view the page hides its header, drawer and tools, and the
         island lays itself out as a first person game on a phone: Let go and
         the eye at the top right, the stick at the left thumb, the acts and
         the cast at the right thumb, a slim hot bar along the bottom, and a
         mark in the middle where a spell lands. */
      #eye {
        position: absolute;
        right: 10px;
        top: 118px;
        width: 72px;
        height: 44px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 0;
        border: 2px solid #05080f;
        border-radius: 10px;
        background: #1b2440;
        color: #f6efdc;
        font:
          700 12px/1 system-ui,
          sans-serif;
        box-shadow: 0 3px 0 #05080f;
        cursor: pointer;
      }
      #eye svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }
      #eye[aria-pressed="true"] {
        background: #ffc23d;
        color: #1a1405;
      }
      #eye[hidden],
      #mark[hidden],
      #landing[hidden],
      #acts[hidden],
      #castbtn[hidden],
      #held[hidden],
      #hotbar[hidden] {
        display: none;
      }
      body.eyes #letgo {
        top: 10px;
        width: 72px;
        padding: 0;
      }
      body.eyes #eye {
        top: 62px;
      }
      body.eyes #story {
        max-width: calc(100% - 104px);
        min-height: 40px;
        padding: 6px 12px 6px 10px;
        background: rgba(13, 18, 36, 0.62);
        box-shadow: none;
      }
      body.eyes #world {
        cursor: crosshair;
      }
      body.eyes #stick {
        bottom: calc(76px + env(safe-area-inset-bottom));
        background: radial-gradient(circle, rgba(27, 36, 64, 0.35) 0 55%, rgba(27, 36, 64, 0.6) 56%);
      }
      #mark {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        pointer-events: none;
        background:
          linear-gradient(#fff, #fff) center / 2px 8px no-repeat,
          linear-gradient(#fff, #fff) center / 8px 2px no-repeat;
        filter: drop-shadow(0 0 1px #05080f) drop-shadow(0 0 1px #05080f);
        opacity: 0.85;
      }
      #mark.held {
        border: 2px solid #ffc23d;
        border-radius: 50%;
        box-sizing: border-box;
        opacity: 1;
      }
      #mark.far {
        border-style: dashed;
      }
      #landing {
        position: absolute;
        left: -9px;
        top: -5px;
        width: 18px;
        height: 10px;
        box-sizing: border-box;
        border: 2px solid #ffc23d;
        border-radius: 50%;
        pointer-events: none;
        filter: drop-shadow(0 0 1px #05080f);
      }
      /* From behind: clear of the page's tool rail at the right edge, as the powers were. */
      #acts {
        position: absolute;
        right: 62px;
        bottom: 16px;
        width: 124px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
      }
      body.eyes #acts {
        right: 12px;
        bottom: calc(76px + env(safe-area-inset-bottom));
      }
      #deeds {
        display: flex;
        flex-wrap: wrap-reverse;
        justify-content: flex-end;
        gap: 10px;
      }
      /* The creature's own powers join its acts at the right thumb. */
      #acts #powers {
        position: static;
        display: contents;
      }
      #acts #powers[hidden] {
        display: none;
      }
      #acts #powers button {
        color: #1a1405;
      }
      #deeds button {
        position: relative;
        width: 56px;
        height: 56px;
        padding: 0;
        border: 2px solid #05080f;
        border-radius: 50%;
        background: #1b2440;
        color: #f6efdc;
        font:
          800 11px/1.1 system-ui,
          sans-serif;
        box-shadow: 0 3px 0 #05080f;
        cursor: pointer;
      }
      #deeds button.busy {
        opacity: 0.55;
      }
      #castbtn {
        width: 72px;
        height: 72px;
        padding: 0;
        border: 2px solid #05080f;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 40%, #ffe29a, #ffc23d 60%, #d99a12);
        color: #1a1405;
        font:
          800 14px/1 system-ui,
          sans-serif;
        box-shadow: 0 4px 0 #05080f;
        cursor: pointer;
      }
      #held {
        position: absolute;
        left: 50%;
        bottom: calc(66px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        max-width: calc(100% - 270px);
        min-width: 60px;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(13, 18, 36, 0.7);
        color: #ffd77a;
        font:
          700 12px/1.25 system-ui,
          sans-serif;
        text-align: center;
        pointer-events: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #hotbar {
        position: absolute;
        left: 50%;
        bottom: calc(8px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        max-width: calc(100% - 16px);
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 2px solid #05080f;
        border-radius: 10px;
        background: rgba(13, 18, 36, 0.72);
        overflow-x: auto;
        scrollbar-width: none;
        box-sizing: border-box;
      }
      #hotbar button {
        flex: none;
        width: 46px;
        height: 46px;
        padding: 0;
        border: 2px solid #3a4466;
        border-radius: 8px;
        background: #1b2440;
        font:
          22px/1 system-ui,
          sans-serif;
        cursor: pointer;
      }
      #hotbar button[aria-pressed="true"] {
        border-color: #ffc23d;
        background: #3a3012;
        box-shadow: inset 0 0 0 1px #ffc23d;
      }
      #hotbar button.waiting {
        opacity: 0.45;
      }
      /* The button at the bar's end stays in reach while the bar scrolls. */
      #hotbar button.all {
        position: sticky;
        right: 0;
        width: 52px;
        border-color: #ffc23d;
        background: #1b2440;
        color: #ffc23d;
        font:
          800 13px/1 system-ui,
          sans-serif;
        box-shadow: -6px 0 8px rgba(13, 18, 36, 0.9);
      }
      /* The whole list over the view, with a search; the eyes stay behind it. */
      #allspells {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 64px;
        bottom: calc(70px + env(safe-area-inset-bottom));
        max-width: 560px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        box-sizing: border-box;
        border: 2px solid #05080f;
        border-radius: 12px;
        background: rgba(13, 18, 36, 0.94);
        color: #f6efdc;
      }
      #allspells[hidden],
      #burn[hidden] {
        display: none;
      }
      #allspells .top {
        display: flex;
        gap: 8px;
      }
      #allspells input {
        flex: 1;
        min-width: 0;
        height: 44px;
        padding: 0 12px;
        box-sizing: border-box;
        border: 1px solid #3a4466;
        border-radius: 8px;
        background: #0b1020;
        color: #f6efdc;
        font:
          15px system-ui,
          sans-serif;
      }
      #allspells .close {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 8px;
        background: #1b2440;
        color: #f6efdc;
        font-size: 22px;
        cursor: pointer;
      }
      #allspells .list {
        flex: 1;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        align-content: start;
        gap: 6px;
      }
      #allspells .list button {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 4px 8px;
        border: 2px solid #3a4466;
        border-radius: 8px;
        background: #1b2440;
        color: #f6efdc;
        font:
          600 13px/1.2 system-ui,
          sans-serif;
        text-align: left;
        cursor: pointer;
      }
      #allspells .list button[aria-pressed="true"] {
        border-color: #ffc23d;
        background: #3a3012;
      }
      #allspells .list button.waiting {
        opacity: 0.5;
      }
      #allspells .emoji {
        font-size: 20px;
      }
      #allspells .none {
        color: #a9b2cf;
      }
      /* Burning: a warm edge round the view. */
      #burn {
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 70px 18px rgba(255, 110, 20, 0.55);
        animation: burn-flicker 0.35s ease-in-out infinite alternate;
      }
      @keyframes burn-flicker {
        to {
          box-shadow: inset 0 0 90px 26px rgba(255, 70, 10, 0.65);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #burn {
          animation: none;
        }
      }
      /* The creature's health by its name, and the island's trouble above its thought. */
      #story .hp {
        display: inline-block;
        width: 46px;
        height: 6px;
        margin-left: 8px;
        vertical-align: middle;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #story .hp i {
        display: block;
        height: 100%;
      }
      #story .trouble {
        color: #ffb36b;
        font-size: 13px;
        font-weight: 700;
      }
      #hotbar .empty {
        padding: 0 10px;
        color: #a9b2cf;
        font:
          600 12px/46px system-ui,
          sans-serif;
        white-space: nowrap;
      }
      #inspect .close {
        border: 0;
        background: none;
        color: #f3eedf;
        font-size: 22px;
        line-height: 1;
        min-width: 44px;
        min-height: 44px;
        margin: -8px -10px -8px 0;
        padding: 0;
        cursor: pointer;
      }
      #inspect .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 3px 0;
      }
      #inspect .bar .label {
        width: 52px;
        color: #a9b2cf;
        font-size: 12px;
      }
      #inspect .track {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #inspect .track i {
        display: block;
        height: 100%;
      }
      #inspect .rows {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 8px 0 0;
      }
      #inspect dt {
        color: #a9b2cf;
      }
      #inspect dd {
        margin: 0;
      }
      /* The first look at a new island (4.4.5 part B): its name, then each wonder. */
      #first-look {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        width: min(360px, calc(100% - 32px));
        box-sizing: border-box;
        padding: 12px 14px 10px;
        border-radius: 10px;
        background: rgba(21, 29, 51, 0.9);
        box-shadow: 0 3px 0 #05080f;
        color: #f3eedf;
        font:
          13px/1.4 system-ui,
          sans-serif;
        text-align: center;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
        transition: opacity 0.4s;
      }
      #first-look[hidden] {
        display: none;
      }
      #first-look .title {
        margin: 0;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #first-look .what {
        margin: 2px 0 0;
        color: #ffc54d;
        font-size: 13px;
      }
      #first-look .does {
        margin: 4px 0 0;
        color: #a9b2cf;
      }
      /* Below 700 px the host's tool rail runs down the right edge (44 px and
         a 10 px margin): the card keeps clear of it on both sides. */
      @media (max-width: 699px) {
        #first-look {
          width: min(360px, calc(100% - 128px));
        }
      }
      #first-look .skip {
        margin-top: 8px;
        min-height: 44px;
        border: 1px solid #56669a;
        border-radius: 8px;
        background: #1e2846;
        box-shadow: 0 3px 0 #05080f;
        color: #f3eedf;
        font: inherit;
        font-weight: 600;
        padding: 0 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Runs Claude's spell code. Loaded in a sandboxed iframe with no origin and no network. -->
    <canvas id="world" aria-label="The world: tap to cast the selected spell, drag to turn, pinch to zoom, two fingers to pan"></canvas>
    <canvas id="overlay"></canvas>
    <div id="inspect" hidden aria-live="polite"></div>
    <div id="first-look" hidden aria-live="polite"></div>
    <div id="pointer" hidden></div>
    <button id="story" type="button" hidden aria-live="polite"></button>
    <button id="watch" type="button" aria-pressed="false" title="Watch the island: the camera goes to what is happening">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
        <circle cx="12" cy="12" r="2.8" />
      </svg>
      <span>Watch</span>
    </button>
    <div id="stick" hidden role="application" aria-label="Walk: push the stick the way to go"><i></i></div>
    <div id="powers" hidden></div>
    <button id="letgo" type="button" hidden>Let go</button>
    <button id="eye" type="button" hidden aria-pressed="false" title="See through its eyes, or from behind it">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
        <circle cx="12" cy="12" r="2.8" />
      </svg>
      <span>Eyes</span>
    </button>
    <div id="mark" hidden aria-hidden="true"></div>
    <div id="landing" hidden aria-hidden="true"></div>
    <div id="acts" hidden>
      <div id="deeds"></div>
      <button id="castbtn" type="button" hidden>Cast</button>
    </div>
    <div id="held" hidden aria-live="polite"></div>
