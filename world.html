<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic Merger world</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0816;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #world {
        cursor: grab;
      }
      #overlay {
        pointer-events: none;
      }
      /* The island tells its stories (2026-11-11): one line saying what the
         camera is on, or what just happened; and the button that starts it. */
      #story {
        position: absolute;
        left: 10px;
        top: 10px;
        max-width: calc(100% - 20px);
        box-sizing: border-box;
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        padding: 8px 14px 8px 12px;
        border: 0;
        border-left: 4px solid #ffc23d;
        border-radius: 4px 12px 12px 4px;
        background: rgba(13, 18, 36, 0.86);
        color: #f6efdc;
        font:
          600 14px/1.3 system-ui,
          sans-serif;
        text-align: left;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        cursor: pointer;
        opacity: 1;
        transition:
          opacity 0.35s,
          transform 0.35s;
      }
      #story[hidden] {
        display: none;
      }
      #story.out {
        opacity: 0;
        transform: translateY(-6px);
      }
      #story .go {
        flex: none;
        color: #ffc23d;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      #watch {
        position: absolute;
        left: 10px;
        bottom: 12px;
        min-width: 44px;
        height: 44px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px 0 11px;
        border: 2px solid #05080f;
        border-radius: 10px;
        background: #1b2440;
        color: #f6efdc;
        font:
          700 13px/1 system-ui,
          sans-serif;
        box-shadow: 0 3px 0 #05080f;
        cursor: pointer;
      }
      #watch[hidden] {
        display: none;
      }
      #watch svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }
      #watch[aria-pressed="true"] {
        background: #ffc23d;
        color: #1a1405;
      }
      @media (prefers-reduced-motion: reduce) {
        #story {
          transition: none;
        }
      }
      /* What a tapped creature is doing (3.6). */
      #inspect {
        position: absolute;
        left: 10px;
        top: 10px;
        width: min(300px, calc(100% - 20px));
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(21, 29, 51, 0.92);
        color: #f3eedf;
        font:
          13px/1.35 system-ui,
          sans-serif;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      }
      #inspect[hidden] {
        display: none;
      }
      #inspect .head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 6px;
      }
      #inspect .title {
        font-size: 15px;
      }
      #inspect .sub {
        flex: 1;
        color: #a9b2cf;
        font-size: 12px;
      }
      #inspect .follow {
        margin-top: 8px;
        min-height: 44px;
        width: 100%;
        border: 2px solid #05080f;
        border-radius: 10px;
        background: #ffc23d;
        color: #1a1405;
        font:
          700 14px/1 system-ui,
          sans-serif;
        cursor: pointer;
      }
      #inspect .close {
        border: 0;
        background: none;
        color: #f3eedf;
        font-size: 20px;
        line-height: 1;
        padding: 0 2px;
        cursor: pointer;
      }
      #inspect .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 3px 0;
      }
      #inspect .bar .label {
        width: 52px;
        color: #a9b2cf;
        font-size: 12px;
      }
      #inspect .track {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #inspect .track i {
        display: block;
        height: 100%;
      }
      #inspect .rows {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 8px 0 0;
      }
      #inspect dt {
        color: #a9b2cf;
      }
      #inspect dd {
        margin: 0;
      }
      /* The first look at a new island (4.4.5 part B): its name, then each wonder. */
      #first-look {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        width: min(360px, calc(100% - 32px));
        box-sizing: border-box;
        padding: 12px 14px 10px;
        border-radius: 10px;
        background: rgba(21, 29, 51, 0.9);
        box-shadow: 0 3px 0 #05080f;
        color: #f3eedf;
        font:
          13px/1.4 system-ui,
          sans-serif;
        text-align: center;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
        transition: opacity 0.4s;
      }
      #first-look[hidden] {
        display: none;
      }
      #first-look .title {
        margin: 0;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #first-look .what {
        margin: 2px 0 0;
        color: #ffc54d;
        font-size: 13px;
      }
      #first-look .does {
        margin: 4px 0 0;
        color: #a9b2cf;
      }
      /* Below 700 px the host's tool rail runs down the right edge (44 px and
         a 10 px margin): the card keeps clear of it on both sides. */
      @media (max-width: 699px) {
        #first-look {
          width: min(360px, calc(100% - 128px));
        }
      }
      #first-look .skip {
        margin-top: 8px;
        min-height: 44px;
        border: 1px solid #56669a;
        border-radius: 8px;
        background: #1e2846;
        box-shadow: 0 3px 0 #05080f;
        color: #f3eedf;
        font: inherit;
        font-weight: 600;
        padding: 0 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Runs Claude's spell code. Loaded in a sandboxed iframe with no origin and no network. -->
    <canvas id="world" aria-label="The world: tap to cast the selected spell, drag to turn, pinch to zoom, two fingers to pan"></canvas>
    <canvas id="overlay"></canvas>
    <div id="inspect" hidden aria-live="polite"></div>
    <div id="first-look" hidden aria-live="polite"></div>
    <button id="story" type="button" hidden aria-live="polite"></button>
    <button id="watch" type="button" aria-pressed="false" title="Watch the island: the camera goes to what is happening">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
        <circle cx="12" cy="12" r="2.8" />
      </svg>
      <span>Watch</span>
    </button>
    <script type="module" src="/src/sim/frame.ts"></script>
  </body>
</html>
