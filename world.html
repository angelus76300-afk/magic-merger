<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic Merger world</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0816;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #world {
        cursor: grab;
      }
      #overlay {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Runs Claude's spell code. Loaded in a sandboxed iframe with no origin and no network. -->
    <canvas id="world" aria-label="The world: tap to cast the selected spell, drag to turn, pinch to zoom, two fingers to pan"></canvas>
    <canvas id="overlay"></canvas>
    <script type="module" src="/src/sim/frame.ts"></script>
  </body>
</html>
